name: Флоу
description: Реализовать пользовательский флоу целиком или его часть — агент разобьёт его на подзадачи
title: "[Флоу] "
labels: ["type:feature", "flow"]
body:
  - type: markdown
    attributes:
      value: |
        Флоу — это крупная задача: агент-проджект сделает из неё «зонтик» и разобьёт на подзадачи по областям и шагам. Описание флоу агент берёт из `docs/user_flows.md`.
  - type: dropdown
    id: flow
    attributes:
      label: Флоу
      options:
        - "F1 — Первый запуск и онбординг (бета)"
        - "F2 — Вход по ссылке на колоду (v1)"
        - "F3 — Вход с SEO-страницы слова (v1)"
        - "F4 — Переезд из Anki или Quizlet (v1)"
        - "F5 — Вход на новом устройстве (бета)"
        - "F6 — Добавление слова за 5 секунд (бета)"
        - "F7 — Добавление через «Поделиться» (v1)"
        - "F8 — Добавление с камеры (v1)"
        - "F9 — Слова из субтитров (v2)"
        - "F10 — Сессия повторения (бета)"
        - "F11 — Итог сессии и «На сегодня всё» (бета)"
        - "F12 — Возврат по напоминанию (v1)"
        - "F13 — Возвращение после перерыва (v1)"
        - "F14 — Правка, удаление, «Знаю это слово» (бета)"
        - "F15 — Каталог колод (бета)"
        - "F16 — Шеринг колоды (v1)"
        - "F17 — Экспорт (бета)"
        - "F18 — Прогресс и достижения (v1)"
        - "F19 — Paywall и покупка (релиз)"
        - "F20 — Восстановление и отмена подписки (релиз)"
        - "F21 — Настройки (бета)"
        - "F22 — Удаление аккаунта (бета)"
        - "F23 — Вторая языковая пара (v2)"
        - "F24 — Лист ожидания языка (бета)"
        - "F25 — Кабинет преподавателя (v2)"
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Объём
      options:
        - Весь флоу
        - Только основной путь, без веток
        - Отдельные шаги (укажу ниже)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Какие шаги или ветки
      description: Если выбрали «Отдельные шаги» — перечислите. Можно ссылаться на номера шагов из docs/user_flows.md.
  - type: textarea
    id: notes
    attributes:
      label: Уточнения и изменения
      description: Что должно отличаться от описания флоу в документах, если что-то поменялось.
  - type: dropdown
    id: priority
    attributes:
      label: Насколько важно для беты
      options:
        - Обязательно для беты
        - Желательно
        - После беты
