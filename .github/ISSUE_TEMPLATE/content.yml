name: Контент словаря или колоды
description: Ошибка в слове, переводе, примере или предложение по колоде
title: '[Контент] '
labels: ['type:content', 'area:content']
body:
  - type: dropdown
    id: kind
    attributes:
      label: Что именно
      options:
        - Ошибка в переводе, примере или уровне
        - Не хватает слова или значения
        - Новая колода
        - Правка колоды
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: Слово или колода
      placeholder: 'bill (счёт в ресторане) / колода «Ресторан и кафе»'
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Подробности
      description: Что не так и как должно быть.
    validations:
      required: true
