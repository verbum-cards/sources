# Проверки для каждого PR и основной ветки: типы и тесты.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else echo "Нет lockfile — проверки пропущены"; exit 0; fi
      - name: Typecheck
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm -r typecheck
      - name: Tests
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm -r test --if-present
