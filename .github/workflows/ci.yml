# Проверки для каждого PR и основной ветки: типы и тесты.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "Нет lockfile — проверки пропущены"; exit 0; fi
      - name: Typecheck
        if: hashFiles('package-lock.json') != ''
        run: npm run typecheck --workspaces --if-present
      - name: Tests
        if: hashFiles('package-lock.json') != ''
        run: npm run test --workspaces --if-present
