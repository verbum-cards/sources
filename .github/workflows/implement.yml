# Реализация задачи после того, как владелец поставил метку ready.
# Результат — ветка и pull request со ссылкой на issue.
name: Implement

on:
  issues:
    types: [labeled]

concurrency:
  group: implement-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      github.event.label.name == 'ready' &&
      contains(github.event.issue.labels.*.name, 'triage:done') &&
      !contains(github.event.issue.labels.*.name, 'needs-design') &&
      !contains(github.event.issue.labels.*.name, 'needs-info')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.CARDS_BOT_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else echo "Нет lockfile — пропускаю установку"; fi
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.CARDS_BOT_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CARDS_BOT_TOKEN }}
          prompt: "/implement-issue ${{ github.event.issue.number }}"
          claude_args: |
            --model claude-sonnet-5
            --max-turns 100
